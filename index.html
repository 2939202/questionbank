<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<title>Quiz</title>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }



body {

background: #fff;

color: #000;

font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;

font-size: 15px;

min-height: 100vh;

display: flex;

flex-direction: column;

align-items: center;

padding: 48px 20px 80px;

}



.wrap {

width: 100%;

max-width: 640px;

}

@media (min-width: 900px) {

.wrap { max-width: 1100px; }

body { padding: 56px 48px 80px; }

}



@media (min-width: 900px) {

.desktop-grid {

display: grid;

grid-template-columns: 1fr 320px;

gap: 48px;

align-items: start;

}

.sidebar { position: sticky; top: 48px; }

}



.progress-meta {

display: flex;

justify-content: space-between;

font-size: 13px;

color: #888;

margin-bottom: 6px;

}

.progress-track { height: 2px; background: #ddd; margin-bottom: 32px; }

.progress-fill { height: 100%; background: #000; transition: width 0.3s ease; }



.score-row { display: flex; gap: 16px; font-size: 13px; color: #888; margin-bottom: 40px; }

.score-row b { color: #000; }



@media (min-width: 900px) {

.score-row { display: none; }

.sidebar-score {

background: #f8f8f8;

border-radius: 8px;

padding: 24px;

margin-bottom: 24px;

}

.sidebar-score .item {

display: flex;

justify-content: space-between;

font-size: 13px;

color: #888;

padding: 6px 0;

border-bottom: 1px solid #eee;

}

.sidebar-score .item:last-child { border-bottom: none; }

.sidebar-score .item b { color: #000; }

}

@media (max-width: 899px) {

.sidebar { display: none; }

}



.q-number { font-size: 12px; color: #aaa; margin-bottom: 12px; }

.q-text { font-size: 19px; line-height: 1.65; margin-bottom: 32px; font-weight: 500; }

@media (min-width: 900px) {

.q-text { font-size: 22px; }

}



.input-row { display: flex; gap: 8px; }

.answer-input {

flex: 1;

border: 1px solid #ccc;

border-radius: 4px;

padding: 10px 14px;

font-size: 15px;

font-family: inherit;

outline: none;

transition: border-color 0.15s;

}

@media (min-width: 900px) {

.answer-input { padding: 13px 18px; font-size: 16px; }

}

.answer-input:focus { border-color: #000; }

.answer-input:disabled { background: #f5f5f5; color: #999; }



.btn {

background: #000;

color: #fff;

border: none;

border-radius: 4px;

padding: 10px 20px;

font-size: 14px;

font-family: inherit;

cursor: pointer;

}

.btn:disabled { background: #ccc; cursor: not-allowed; }



.feedback { margin-top: 14px; font-size: 14px; line-height: 1.5; display: none; }

.feedback.show { display: block; }

.feedback.correct { color: #000; }

.feedback.wrong { color: #888; }

.feedback .correct-answer { margin-top: 4px; font-size: 13px; }



.divider { border: none; border-top: 1px solid #eee; margin: 32px 0; }



.nav-row { display: flex; justify-content: space-between; }

.btn-nav {

background: none;

border: 1px solid #ddd;

border-radius: 4px;

padding: 8px 18px;

font-size: 13px;

font-family: inherit;

cursor: pointer;

color: #000;

}

.btn-nav:hover { border-color: #000; }

.btn-nav:disabled { color: #ccc; border-color: #eee; cursor: not-allowed; }



#result-screen { display: none; text-align: center; padding-top: 40px; }

.result-score { font-size: 56px; font-weight: 700; letter-spacing: -2px; margin-bottom: 8px; }

.result-sub { font-size: 14px; color: #888; margin-bottom: 40px; }

.result-detail { display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; }

.result-detail .item { font-size: 13px; color: #888; }

.result-detail .item b { display: block; font-size: 24px; color: #000; margin-bottom: 2px; }

.result-btns { display: flex; gap: 12px; justify-content: center; }

.btn-restart {

background: #000; color: #fff; border: none; border-radius: 4px;

padding: 12px 32px; font-size: 14px; font-family: inherit; cursor: pointer;

}

.btn-review {

background: #fff; color: #000; border: 1px solid #000; border-radius: 4px;

padding: 12px 32px; font-size: 14px; font-family: inherit; cursor: pointer;

}



.advance-bar {

height: 2px;

background: #000;

width: 0%;

margin-top: 10px;

transition: none;

border-radius: 2px;

}



@keyframes shake {

0%,100%{transform:translateX(0)}

25%{transform:translateX(-6px)}

75%{transform:translateX(6px)}

}

.shake { animation: shake 0.25s ease; }



#cover-screen {

display: flex;

flex-direction: column;

justify-content: center;

min-height: 60vh;

}

.cover-title {

font-size: clamp(2.4rem, 8vw, 4rem);

font-weight: 700;

letter-spacing: -2px;

margin-bottom: 20px;

line-height: 1.1;

}

.cover-notice {

font-size: 13px;

color: #888;

line-height: 1.8;

margin-bottom: 40px;

border-left: 2px solid #ddd;

padding-left: 14px;

}

.btn-start {

background: #000; color: #fff; border: none; border-radius: 4px;

padding: 14px 40px; font-size: 15px; font-family: inherit; cursor: pointer;

align-self: flex-start;

}



#review-screen { display: none; padding-top: 8px; }

.review-header {

display: flex;

align-items: center;

justify-content: space-between;

margin-bottom: 32px;

}

.review-title { font-size: 20px; font-weight: 700; }

.btn-back {

background: none; border: 1px solid #ddd; border-radius: 4px;

padding: 8px 18px; font-size: 13px; font-family: inherit; cursor: pointer; color: #000;

}

.btn-back:hover { border-color: #000; }

.review-item {

border-top: 1px solid #eee;

padding: 20px 0;

}

.review-item:last-child { border-bottom: 1px solid #eee; }

.review-q { font-size: 15px; line-height: 1.6; margin-bottom: 10px; font-weight: 500; }

.review-meta { font-size: 13px; color: #888; display: flex; flex-direction: column; gap: 4px; }

.review-meta .my-ans { color: #bbb; }

.review-meta .right-ans { color: #000; font-weight: 600; }

.review-qnum { font-size: 11px; color: #bbb; margin-bottom: 6px; }

.no-wrong { color: #888; font-size: 14px; padding: 40px 0; text-align: center; }



/* ── 문제 선택 화면 ── */

#select-screen {

display: none;

flex-direction: column;

min-height: 60vh;

padding-top: 8px;

}

.select-title {

font-size: clamp(1.6rem, 5vw, 2.4rem);

font-weight: 700;

letter-spacing: -1px;

margin-bottom: 8px;

line-height: 1.2;

}

.select-sub {

font-size: 13px;

color: #888;

margin-bottom: 36px;

}

.chapter-list {

display: flex;

flex-direction: column;

gap: 0;

margin-bottom: 40px;

border: 1px solid #e5e5e5;

border-radius: 12px;

overflow: hidden;

}

.chapter-row {

display: flex;

align-items: center;

justify-content: space-between;

padding: 16px 20px;

border-bottom: 1px solid #f0f0f0;

background: #fff;

transition: background 0.12s;

}

.chapter-row:last-child { border-bottom: none; }

.chapter-row.disabled-chapter { opacity: 0.38; }

.chapter-info { display: flex; flex-direction: column; gap: 2px; }

.chapter-name { font-size: 15px; font-weight: 600; }

.chapter-count { font-size: 12px; color: #aaa; }

/* iOS toggle switch */

.toggle-wrap { flex-shrink: 0; }

.ios-toggle {

position: relative;

display: inline-block;

width: 51px;

height: 31px;

}

.ios-toggle input { opacity: 0; width: 0; height: 0; }

.ios-slider {

position: absolute;

cursor: pointer;

top: 0; left: 0; right: 0; bottom: 0;

background: #e5e5ea;

border-radius: 31px;

transition: background 0.22s;

}

.ios-slider::before {

content: '';

position: absolute;

height: 27px; width: 27px;

left: 2px; bottom: 2px;

background: #fff;

border-radius: 50%;

box-shadow: 0 2px 6px rgba(0,0,0,0.22);

transition: transform 0.22s cubic-bezier(.4,1.4,.6,1);

}

.ios-toggle input:checked + .ios-slider { background: #000; }

.ios-toggle input:checked + .ios-slider::before { transform: translateX(20px); }

.ios-toggle input:disabled + .ios-slider { cursor: not-allowed; }

.select-actions {

display: flex;

flex-direction: column;

gap: 10px;

align-items: flex-start;

}

.select-hint {

font-size: 12px;

color: #bbb;

margin-bottom: 4px;

}

.btn-go {

background: #000; color: #fff; border: none; border-radius: 4px;

padding: 14px 40px; font-size: 15px; font-family: inherit; cursor: pointer;

.btn-go:disabled { background: #ccc; cursor: not-allowed; }

// ── 토글 상태 ─────────────────────────────────────────────────
const toggleState = {};
ALL_CHAPTERS.forEach(ch => {
toggleState[ch.id] = ch.available; // 기본: 사용 가능한 장은 ON
});

function buildSelectScreen() {
const list = document.getElementById('chapter-list');
list.innerHTML = '';
ALL_CHAPTERS.forEach(ch => {
const row = document.createElement('div');
row.className = 'chapter-row' + (ch.available ? '' : ' disabled-chapter');

const info = document.createElement('div');
info.className = 'chapter-info';
info.innerHTML = `
<span class="chapter-name">${ch.name}</span>
<span class="chapter-count">${ch.available ? ch.questions.length + '문제' : '준비 중'}</span>
`;

const toggleWrap = document.createElement('label');
toggleWrap.className = 'ios-toggle toggle-wrap';
const inp = document.createElement('input');
inp.type = 'checkbox';
inp.checked = ch.available ? toggleState[ch.id] : false;
inp.disabled = !ch.available;
inp.addEventListener('change', () => {
toggleState[ch.id] = inp.checked;
updateSelectHint();
});
const slider = document.createElement('span');
slider.className = 'ios-slider';
toggleWrap.appendChild(inp);
toggleWrap.appendChild(slider);

row.appendChild(info);
row.appendChild(toggleWrap);
list.appendChild(row);
});
updateSelectHint();
}

function updateSelectHint() {
const active = ALL_CHAPTERS.filter(ch => ch.available && toggleState[ch.id]);
const total = active.reduce((s, ch) => s + ch.questions.length, 0);
const hint = document.getElementById('select-hint');
const btn = document.getElementById('btn-go');
if (total === 0) {
hint.textContent = '최소 1개 장을 선택해 주세요.';
btn.disabled = true;
} else {
const names = active.map(ch => ch.name).join(', ');
hint.textContent = `${names} · 총 ${total}문제`;
btn.disabled = false;
}
}

function goToSelect() {
document.getElementById('cover-screen').style.display = 'none';
const sel = document.getElementById('select-screen');
sel.style.display = 'flex';
buildSelectScreen();
}

// ── 퀴즈 로직 ─────────────────────────────────────────────────

function shuffle(arr) {

const a = [...arr];

for (let i = a.length - 1; i > 0; i--) {

const j = Math.floor(Math.random() * (i + 1));

[a[i], a[j]] = [a[j], a[i]];

}

return a;

}



let QUESTIONS = [];

let current = 0;

let answered = []; // 'correct' | 'wrong' | null

let userAnswers = []; // 사용자가 입력한 답 (문자열)

let advanceTimer = null;

let justSubmitted = false;

const ADVANCE_DELAY = 1000;



function startQuiz() {

// 활성화된 장의 문제만 합쳐서 랜덤 셔플
const pool = [];
ALL_CHAPTERS.forEach(ch => {
if (ch.available && toggleState[ch.id]) {
pool.push(...ch.questions);
}
});
if (pool.length === 0) return;

document.getElementById('select-screen').style.display = 'none';

document.getElementById('quiz-wrap').style.display = 'block';

QUESTIONS = shuffle(pool);

answered = Array(QUESTIONS.length).fill(null);

userAnswers = Array(QUESTIONS.length).fill('');

current = 0;

justSubmitted = false;

render();

}



function normalize(str) {

return str.replace(/s+/g, '').toLowerCase();

}



function isCorrect(input, answer) {



if (Array.isArray(answer)) {



return answer.some(a => normalize(input) === normalize(a));



}

return normalize(input) === normalize(answer);



}



function updateScores() {

const total = QUESTIONS.length;

const done = answered.filter(x => x !== null).length;

const pct = Math.round(done / total * 100);

const correct = answered.filter(x => x === 'correct').length;

const wrong = answered.filter(x => x === 'wrong').length;



document.getElementById('progress-fill').style.width = pct + '%';

document.getElementById('prog-label').textContent = `${done} / ${total}`;

document.getElementById('prog-pct').textContent = pct + '%';



document.getElementById('sc-correct').textContent = correct;

document.getElementById('sc-wrong').textContent = wrong;

document.getElementById('sc-remain').textContent = total - done;



document.getElementById('sd-correct').textContent = correct;

document.getElementById('sd-wrong').textContent = wrong;

document.getElementById('sd-remain').textContent = total - done;

document.getElementById('sd-pct').textContent = pct + '%';

}



function render() {

if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }



const total = QUESTIONS.length;

const q = QUESTIONS[current];

const state = answered[current];



updateScores();



document.getElementById('q-number').textContent = `Q${current + 1} / ${total}`;

document.getElementById('q-text').textContent = q.q;



const input = document.getElementById('answer-input');

const btnSub = document.getElementById('btn-submit');

const fb = document.getElementById('feedback');

const bar = document.getElementById('advance-bar');



bar.style.transition = 'none';

bar.style.width = '0%';



if (state === null) {

input.value = '';

input.disabled = false;

btnSub.disabled = false;

fb.className = 'feedback';

fb.innerHTML = '';

input.focus();

} else if (state === 'correct') {

input.value = Array.isArray(q.a) ? q.a[0] : q.a;

input.disabled = true;

btnSub.disabled = true;

fb.className = 'feedback correct show';

fb.innerHTML = '✓ 정답';

if (justSubmitted) scheduleAdvance(bar);

} else {

input.value = userAnswers[current];

input.disabled = true;

btnSub.disabled = true;

fb.className = 'feedback wrong show';

const answerText = Array.isArray(q.a) ? q.a.join(' / ') : q.a;

fb.innerHTML = `✗ 오답<div class="correct-answer">정답: ${answerText}</div>`;

if (justSubmitted) scheduleAdvance(bar);

}



justSubmitted = false;



document.getElementById('btn-prev').disabled = current === 0;

document.getElementById('btn-next').disabled = current === total - 1;

}



function scheduleAdvance(bar) {

requestAnimationFrame(() => {

bar.style.transition = `width ${ADVANCE_DELAY}ms linear`;

bar.style.width = '100%';

});



advanceTimer = setTimeout(() => {

if (answered.every(x => x !== null)) {

showResult();

} else if (current < QUESTIONS.length - 1) {

current++;

justSubmitted = false;

render();

}

}, ADVANCE_DELAY);

}



function submit() {

const val = document.getElementById('answer-input').value.trim();

if (!val) return;



const result = isCorrect(val, QUESTIONS[current].a) ? 'correct' : 'wrong';

answered[current] = result;

userAnswers[current] = val;



if (result === 'wrong') {

const sec = document.getElementById('quiz-section');

sec.classList.remove('shake');

void sec.offsetWidth;

sec.classList.add('shake');

}



justSubmitted = true;

render();

}



function showResult() {

document.getElementById('quiz-section').style.display = 'none';

document.getElementById('result-screen').style.display = 'block';

document.getElementById('review-screen').style.display = 'none';



const correct = answered.filter(x => x === 'correct').length;

const wrong = answered.filter(x => x === 'wrong').length;

document.getElementById('res-correct').textContent = correct;

document.getElementById('res-wrong').textContent = wrong;

document.getElementById('res-pct').textContent = Math.round(correct / QUESTIONS.length * 100) + '%';

}



function restart() {

document.getElementById('quiz-section').style.display = '';

document.getElementById('result-screen').style.display = 'none';

document.getElementById('review-screen').style.display = 'none';

document.getElementById('quiz-wrap').style.display = 'none';

document.getElementById('select-screen').style.display = 'flex';

buildSelectScreen();

}



function showReview() {

document.getElementById('result-screen').style.display = 'none';

document.getElementById('review-screen').style.display = 'block';



const wrongList = QUESTIONS

.map((q, i) => ({ q, i }))

.filter(x => answered[x.i] === 'wrong');



const list = document.getElementById('review-list');

if (wrongList.length === 0) {

list.innerHTML = '<div class="no-wrong">틀린 문제가 없습니다 야호</div>';

return;

}



list.innerHTML = wrongList.map((x, idx) => `

<div class="review-item">

<div class="review-qnum">오답 ${idx + 1}</div>

<div class="review-q">${x.q.q}</div>

<div class="review-meta">

<span class="my-ans">내 답: ${userAnswers[x.i]}</span>

<span class="right-ans">정답: ${Array.isArray(x.q.a) ? x.q.a.join(' / ') : x.q.a}</span>

</div>

</div>

`).join('');

}



function backToResult() {

document.getElementById('review-screen').style.display = 'none';

document.getElementById('result-screen').style.display = 'block';

}



document.getElementById('btn-submit').addEventListener('click', submit);

document.getElementById('answer-input').addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });

document.getElementById('btn-prev').addEventListener('click', () => {

if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }

justSubmitted = false;

if (current > 0) { current--; render(); }

});

document.getElementById('btn-next').addEventListener('click', () => {

if (advanceTimer) { clearTimeout(advanceTimer); advanceTimer = null; }

justSubmitted = false;

if (current < QUESTIONS.length - 1) { current++; render(); }

});

</script>
